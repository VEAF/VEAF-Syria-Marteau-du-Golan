settings:
# USAGE NOTES:
#
# 1. Matching: THE MOST SPECIFIC PLAN WINS
#    - A plan is a candidate when every criterion it states matches; the ones it omits are wildcards.
#    - Among the candidates, the plan stating the MOST criteria wins. So a plan naming an aircraft type
#      beats one naming only a coalition and a category, wherever the two are written in this file.
#    - Declaration order only breaks a tie between two plans of equal specificity, and only then.
#    - A plan with no criteria at all is the fallback: it matches everything and loses to everything.
#    - Worked example, from this very file: a blue F-16C matches both `all_blue_planes` and
#      `f16_flight_plan`, and gets `f16_flight_plan` because it is the more specific of the two. Another
#      blue plane gets `all_blue_planes`.
#    - This changed on 2026-08-24. Until then the FIRST compatible plan won, so `f16_flight_plan` above
#      was unreachable — while this file and the code's own docstring both described the priority that is
#      now implemented. If you had ordered your plans narrow-first to work around it, nothing changes for
#      you. See FIX-WAYPOINTS-PLAN-PRIORITY.
#
# 2. Targeting:
#    - Only human-piloted aircraft groups receive waypoints
#    - Leave a setting with no criteria as a fallback for all units
#
# 3. Coordinates:
#    - X and Y are in mission coordinates (not lat/lon)
#    - Altitude (alt) is in meters
#    - Speed is in m/s
#
# 4. Waypoint Order:
#    - Waypoints are injected in the order they appear in the settings
#    - The first waypoint becomes the initial waypoint
#
# 5. A plan takes its waypoints BY KEY:
#    - Write them as a list of keys, as above.
#    - The older mapping form (`HOLDING_POINT: "HOLDING_POINT"`) still loads, but only its KEYS are read: the
#      value is ignored. `POTI: "POTI_LOW"` flies to POTI, not POTI_LOW — the build warns when a value names
#      another waypoint.
#
# 6. Fields:
#    - type: "Turning Point", "TakeOffGround", "TakeOff", "Landing", etc.
#    - action: Usually same as type
#    - alt_type: "BARO" (barometric) or "RADIO" (AGL)
#    - speed_type: "TAS" (true airspeed) or "IAS" (indicated airspeed)
#    - ETA fields are optional
#    - name: what the cockpit shows; the waypoint's key when absent
  Jets:
    coalition: blue
    category: plane
    waypoints:
      - JETS_PUSH
      - JETS_TELLHARA
      - JETS_KHAN
      - JETS_COLONNE
      - JETS_KANAKER
      - JETS_SASA
      - JETS_SA6
      - JETS_SA11
      - JETS_KISWAH
      - JETS_EGRESS
      - JETS_BULLSEYE
