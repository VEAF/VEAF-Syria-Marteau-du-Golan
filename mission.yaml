# mission.yaml — generated by `veaf-tools prepare`. Edit freely.
# Run `veaf-tools validate` to check it, then `veaf-tools build`.

# ── Guide rapide de syntaxe YAML ────────────────────────────────────────────
# Indentation : espaces uniquement (pas de tabulations). Chaque niveau = 2 espaces.
# Guillemets : uniquement si la valeur contient  :  #  {  [  ou commence par un chiffre.
#   name: Mon-Vol-01            # OK — pas de guillemets
#   name: "Vol: Aller-Retour"   # obligatoire — contient :
#   Aussi obligatoires si la valeur contient des séquences d'échappement comme  \n  \t
#   briefing: "Intercept bandits\nRTB when done"  # obligatoire — contient \n
# Texte multiligne : utilisez  |  (bloc littéral) — chaque ligne suivante indentée de 2 espaces supplémentaires.
#   briefing: |
#     deuxième ligne
# Listes : chaque élément sur sa propre ligne, précédé de  -
#   groups:
#     - MIG-29_SOLO
#     - MIG-21_SOLO
# Booléens : true / false  (sans guillemets)
# Valeur vide (modules obligatoires) : MODULE:   (rien après le deux-points)
# ────────────────────────────────────────────────────────────────────────────

# ── Niveau de log global ─────────────────────────────────────────────────────
# Force tous les loggers VEAF à ce niveau. Supprimer ou mettre 'info' en production.
# Valeurs : error | warning | info | debug | trace
# Doc : https://veaf.github.io/documentation/dev/mission-maker/GUIDE/#debug-logging
#
# global_log_level: debug

# ── Mission ──────────────────────────────────────────────────────────────────
# Identité de la mission (nom, chemin d'export, ère) et options globales (ex. silence_atc_on_all_airbases) — utilisées dans les menus radio et les logs.
mission:
  name: "VEAF_Syria_MarteauDuGolan"
#   export_path: null             # null = default DCS Saved Games path
  era: MODERN                     # MODERN | COLD_WAR | WW2
  language: fr                    # langue des messages VEAF en jeu : fr | en (défaut : langue des outils)
  silence_atc_on_all_airbases: true  # mission-wide option: silence ATC at every airbase
#   hide_names_from_spawned_groups: true  # default true: a spawned group is named
#                               # `[r]-<invented name>#<id>` instead of carrying its zone and
#                               # type, so a player cannot read a zone's contents off the F10
#                               # map. Set false while building or debugging a mission.
#   ground_control:               # slots of the roles that fly no aircraft, set at every build
#     game_master: 5              # a number applies to both sides; {blue: 5, red: 0} sets them apart
#     tactical_commander: 5
#     jtac: 5
#     observer: 5
#     pilot_control_vehicles: true  # a pilot may drive ground vehicles
#   forced_options:               # options enforced on every player, set at every build
#     labels: none                # full | abbreviated | symbol_only | dot_neutral | none
#     f10_view: fog_of_war        # all | fog_of_war | allies_only | map_only | my_aircraft
#     external_views: false       # full list: doc MISSION_YAML_REFERENCE, forced_options

# ── Sécurité ─────────────────────────────────────────────────────────────────
# Protection par mot de passe pour les accès Mission Master et contrôleur JTF.
# Doc : https://veaf.github.io/documentation/dev/mission-maker/GUIDE/#security-tiers
# security:
#   disabled: true                # true = no password required (default: false — security is active)
#   password_hashes:              # SHA-1 of the SENIOR_PILOT password (also opens KNOWN_PILOT): .\veaf-tools.exe password-hash
#     - "<SHA-1 hash>"

# ── Opposition ───────────────────────────────────────────────────────────────
# Crée le menu radio Opposition et le marqueur _opposition : le Mission Maker règle en vol les QRA
# marquées scale_with_opposition (niveau 1 à 8 joueurs en CAP, suivi des joueurs, ou « 0 avion »).
# level 0 : au démarrage, chaque QRA décolle selon le nombre d'avions entrés dans sa zone.
opposition:
  level: 0

modules:
  # ── Infrastructure ──
  UNITS:
  TIME:
  CACHE:
  EVENTS:
  MARKERS:
  COMMANDS:
  # ── Core ──
  RADIO: true  # the VEAF F10 radio menu
  SPAWN: true
  SHORTCUTS: true  # built-in aliases (-shilka, -sa2, …)
  INTERPRETER: true
  SECURITY: true   # the /secu verbs (elevate, …); turn the level check off with `security: disabled: true`
  # ── Features ──
  NAMEDPOINTS: true
  MOVE: true
  GRASS: true
  WEATHER: true
  REMOTE: true
  AIRBASES: true
  COMBATLOG: true  # every shot, hit and kill to veaf-combat-log-*.jsonl (veaf-tools combat-log)
  # ── Combat ──
  GROUNDAI: true  # ground units AI behaviour (required by CASMISSION)
  CASMISSION: true  # `_cas` marker (no config)
  TRANSPORTMISSION: true  # `_transport` marker (no config)
  COMBATMISSION: true
  CARRIER: true  # carrier-operations radio menus
  #   COMBATZONE:
  #     enabled: true
  #     combat_zones:
  #       - type: zone
  #         zone_name: CZ-Alpha
  #         friendly_name: Alpha Zone
  #         training: false
  #   QRA:
  #     enabled: true
  #     definitions:
  #       - name: Base QRA
  #         coalition: RED
  #         enemy_coalitions: [BLUE]
  #         trigger_zone: QRA zone
  #         zone_radius: 30000
  #         groups_by_enemy_count:
  #           - enemy_count: 1
  #             groups: [Group1, Group2]
  #             random_pick: 1
  #   AIRWAVES:
  #     enabled: true
  #     airwave_zones:
  #       - name: BVR Zone
  #         start: true
  #         player_coalitions: [BLUE]
  #         zone_center_coordinates: "N41°00'00\" E044°00'00\""
  #         zone_radius: 50000
  #         waves:
  #           - groups: su27-2ship
  #             delay: 0
  #   ASSETS:
  #     enabled: true
  #     assets:
  #       - sort: 1
  #         name: T1-Arco-1
  #         description: Arco-1 (KC-135)
  #         information: "Tacan 64Y\nU290.50 (20)"
  #   SANCTUARY:
  #     enabled: true
  #     sanctuary_zones:
  #       - name: Base Alpha
  #         polygon_units:          # or a circle: trigger_zone: SANCT Alpha
  #           - Sanctuary-Unit-1
  #         coalition: BLUE
  #         delay_warning: 30
  #         delay_spawn: 60
  # ── Community ──
  STTS: true
  CTLD:                      # settings live in ctld-config.yaml (edit it with ctld-tools)
    enabled: true
    manage_logistics: true   # every carrier and FARP ammo dump becomes a CTLD loading point;
                             # set to false to own logisticUnitTypes/troopZoneShipTypes yourself
    manage_airbase_logistics: true   # every airdrome becomes a CTLD logistic zone, held over time;
                                     # false opts out entirely: no zone, no tick, no map circle
    airbase_logistics_radius: 250    # metres of logistic zone around each airfield's stand
    airbase_occupation_radius: 2000  # metres a captured or neutral field probes for ground units
    airbase_logistics_tick: 30       # seconds between two evaluations of every airfield
  CSAR: true
  AIEN: true
  SKYNET: true               # extended: SKYNET -> { enabled: true, include_red_in_radio: false, dynamic_spawn: false, ... }
  # TUM requires BLUFOR/REDFOR territory trigger zones (each owning an airbase) placed
  # in the Mission Editor, or it aborts at start-up. Uncomment once the zones exist:
  #   TUM: true

# ── Pipeline de build ─────────────────────────────────────────────────────────
# Contrôle les étapes d'injection optionnelles après le build de base.
# Chaque étape auto-détecte son fichier de config ; mettre à false pour ignorer.
# Doc : https://veaf.github.io/documentation/dev/mission-maker/GUIDE/#build-profiles
#
# pipeline:
#   presets: true                 # src/presets.yaml
#   waypoints: true               # src/waypoints.yaml
#   spawnable_aircrafts: true     # src/spawnables.yaml
#   dynamic_slot_templates: true  # src/dynamic-slot-templates.yaml
#   warehouses: true              # src/warehouses.yaml (Dynamic-Slot warehouses)
#   spawn_data: true              # always on; src/spawn-groups.yaml extends the spawn DB
#   weather: true                 # src/versions.yaml
  COMBATZONE:
    enabled: true
    combat_zones:
      - type: zone
        zone_name: KhanArnabah
        friendly_name: Front de Khan Arnabah
        briefing: 'Ligne de défense avancée du 1er Corps syrien à Khan Arnabah : chars et BMP retranchés, Shilka, SA-13 et SA-15. Détruire toutes les unités pour ouvrir la route de Quneitra à la poussée alliée.'
        smoke_and_flare: false
        show_units_list: false
        chained_zones:
          - ContreAttaque
        chained_delay: 300
      - type: zone
        zone_name: Sasa
        friendly_name: Réserve blindée de Sa'sa'
        briefing: "Brigade blindée de réserve du 1er Corps, en attente à l'est de Sa'sa' : T-72, BMP-2, couverte par SA-8 et SA-19. Détruire la réserve avant qu'elle ne monte au front."
        smoke_and_flare: false
        show_units_list: false
      - type: zone
        zone_name: SA6Sasa
        friendly_name: Batterie SA-6 de Sa'sa'
        briefing: Batterie SA-6 (2K12 Kub) qui couvre Sa'sa' et la sortie du col de Beit Jinn. Elle doit tomber avant le passage des hélicoptères.
        active_at_start: true
        smoke_and_flare: false
        show_units_list: false
      - type: zone
        zone_name: SA11Kiswah
        friendly_name: Batterie SA-11 de Kiswah
        briefing: Batterie SA-11 (9K37 Buk) qui protège le PC du 1er Corps à Kiswah. La détruire avant la frappe sur le PC.
        active_at_start: true
        smoke_and_flare: false
        show_units_list: false
      - type: zone
        zone_name: Kiswah
        friendly_name: PC du 1er Corps à Kiswah
        briefing: 'Poste de commandement du 1er Corps syrien à Kiswah : centre de commandement, tour de transmissions et deux bunkers, défendus par de la AAA et couverts par la batterie SA-11. Détruire les quatre bâtiments pour priver le front de son commandement.'
        active_at_start: true
        smoke_and_flare: false
        show_units_list: false
      - type: zone
        zone_name: ArtiKanaker
        friendly_name: Artillerie de Kanaker
        briefing: "Groupe d'artillerie du 1er Corps près de Kanaker : quatre obusiers 2S1 et trois lance-roquettes BM-21, qui appuient la ligne de Khan Arnabah. Les détruire avant la poussée alliée."
        smoke_and_flare: false
        show_units_list: false
      - type: zone
        zone_name: ContreAttaque
        friendly_name: Contre-attaque syrienne
        briefing: "La chute de Khan Arnabah déclenche la contre-attaque : une colonne de T-72, de BMP-2 et un Tunguska quitte Sa'sa' par la route de Quneitra, vers la ligne alliée. La casser avant le contact."
        smoke_and_flare: false
        show_units_list: false
        radio_menu_disabled: true
      - type: zone
        zone_name: Poussee
        friendly_name: Lancer la poussée alliée
        briefing: "Groupement d'assaut de la brigade (Merkava, M113, Avenger) : il franchit la ligne à Quneitra, prend Khan Arnabah puis pousse vers Sa'sa' par la route. À déclencher par le Mission Maker, une fois le front dégarni."
        completable: false
        active_at_start: false
        training: false
        radio_group_name: Mission Maker
        smoke_and_flare: false
        show_units_list: false
      - type: zone
        zone_name: EWRTellHara
        friendly_name: Radar d'alerte de Tell al-Hara
        briefing: "Radar d'alerte avancée 55G6 sur la colline de Tell al-Hara : il voit le Golan et renseigne tout le réseau sol-air. Le détruire rend les batteries aveugles hors de leur propre radar."
        smoke_and_flare: false
        show_units_list: false
      - type: operation
        zone_name: OpMarteauGolan
        friendly_name: Opération Marteau du Golan
        briefing: "Percer le front du 1er Corps syrien sur le Golan : aveugler la défense sol-air, détruire la ligne de Khan Arnabah, la réserve de Sa'sa' et l'artillerie de Kanaker. Objectifs secondaires : le SA-11 et le PC de Kiswah."
        active_at_start: true
        tasking_orders:
          - zone_name: EWRTellHara
          - zone_name: KhanArnabah
          - zone_name: ArtiKanaker
          - zone_name: Sasa
        # SA6Sasa, SA11Kiswah et Kiswah : actifs au démarrage hors opération, pour que l'opération
        # se termine même sans SEAD ni frappe, et que le Mission Maker puisse désactiver chacun d'eux
        # (une zone d'opération n'a pas sa propre commande « Désactiver »)
  QRA:
    enabled: true
    definitions:
      - name: QRA Mezzeh
        coalition: RED
        trigger_zone: QRA-Mezzeh
        enemy_coalitions:
          - BLUE
        groups_by_enemy_count:
          - enemy_count: 1
            groups:
              - QRA-Mezzeh-MiG29-1
          - enemy_count: 4
            groups:
              - QRA-Mezzeh-MiG29-1
              - QRA-Mezzeh-MiG29-2
        delay_before_activating: 900
        react_on_helicopters: false
        scale_with_opposition: true
      - name: QRA Khalkhalah
        coalition: RED
        trigger_zone: QRA-Khalkhalah
        enemy_coalitions:
          - BLUE
        groups_by_enemy_count:
          - enemy_count: 1
            groups:
              - QRA-Khalkhalah-MiG23-1
        delay_before_activating: 900
        react_on_helicopters: false
        scale_with_opposition: true
  ASSETS:
    enabled: true
    assets:
      - sort: 1
        name: Magic 1
        description: Magic (E-3A, AWACS)
        information: "U282.20 (Ch. 7)"
      - sort: 2
        name: Texaco 1
        description: Texaco-1 (KC-135MPRS, panier)
        information: "Tacan 60Y\nU290.10 (Ch. 8)\nFL180"
      - sort: 3
        name: Arco 1
        description: Arco-1 (KC-135, perche)
        information: "Tacan 64Y\nU290.50 (Ch. 9)\nFL220"
      - sort: 4
        name: JTAC-AbuNada
        description: JTAC Abu Nada (Hummer, Tel Abu Nada)
        information: "Laser 1511\nFM 35.55"
        jtac: 1511
        freq: 35.55
        mod: FM
pipeline:
  weather: false                  # une seule météo, celle du scénario (set_weather)

# ── Profils de build ──────────────────────────────────────────────────────────
# veaf-tools build --profile LOCAL_TEST : test en local, sans sécurité, logs bavards,
# noms de groupes lisibles. Même nom de .miz que le build serveur : renommer l'un avant l'autre.
profiles:
  LOCAL_TEST:
    global_log_level: debug
    security:
      disabled: true
    mission:
      hide_names_from_spawned_groups: false
  # veaf-tools build --profile TRAINING : version entraînement, sans QRA, SA-6 et SA-11 éteints
  # au démarrage (le Mission Maker les active), toutes les zones en entraînement.
  TRAINING:
    modules:
      QRA:
        enabled: false
      COMBATZONE:
        zone_edits:
          "*": { training: true }
          SA6Sasa: { active_at_start: false }
          SA11Kiswah: { active_at_start: false }
cap_missions:
  - group_name: CAP-Alliee-Masada
    menu_name: CAP alliée (2 F-15C, MASADA)
    briefing: "Deux F-15C alliés en patrouille au FL250 au-dessus de MASADA, hors de portée du SA-11 : ils engagent les avions ennemis qui approchent."
